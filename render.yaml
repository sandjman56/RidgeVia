# Render blueprint for the RidgeVia Health landing page.
# One static site, no build step. Connect the repo in the Render dashboard and it
# picks this file up. Attach ridgevia.co under the service's Custom Domains tab.
services:
  - type: web
    name: ridgevia-site
    runtime: static
    buildCommand: "echo 'static site, no build step'"
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
